<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <alias binding="same">
        <family>CaskaydiaCove NF</family>
        <accept>
            <family>CaskaydiaCove Nerd Font</family>
        </accept>
    </alias>
    <alias binding="same">
        <family>JetBrains Mono NF</family>
        <accept>
            <family>JetBrainsMono Nerd Font</family>
            <family>JetBrainsMono NF</family>
        </accept>
    </alias>
</fontconfig>
